# Uruchomienie obu projektów naraz: `docker compose up --build`
# Wymaga pliku backend/.env (wzór: backend/.env.example).
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - backend-var:/app/var

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-var:
