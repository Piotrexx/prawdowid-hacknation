# Uruchomienie obu projektów naraz: `docker compose up --build`
# Wymaga pliku backend/.env (wzór: backend/.env.example).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: prawdowid
      POSTGRES_USER: prawdowid
      POSTGRES_PASSWORD: prawdowid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prawdowid -d prawdowid"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://prawdowid:prawdowid@postgres:5432/prawdowid
      BIELIK_BASE_URL: http://ollama:11434/v1
      BIELIK_MODEL: SpeakLeash/bielik-4.5b-v3.0-instruct:Q8_0
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
      WHISPER_CACHE_DIR: /app/.cache/whisper
      INGEST_CACHE_DIR: /app/var/ingest
    ports:
      - "8000:8000"
    volumes:
      - backend-var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: >
      sh -c "ollama serve &
        until curl -sf http://localhost:11434/ > /dev/null 2>&1; do sleep 2; done &&
        (ollama list | grep -q 'bielik-4.5b-v3.0-instruct' || ollama pull SpeakLeash/bielik-4.5b-v3.0-instruct:Q8_0) &&
        wait"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-var:
  ollama-data:
  pgdata:
