rules:
  - "Do korpusu trafiają wyłącznie polskojęzyczne źródła wpisane do tego katalogu wraz z uzasadnieniem kwalifikacji."
  - "Poziom 1: źródła pierwotne i urzędowe (organy państwa, instytucje UE, akty prawne, dane publiczne). Poziom 2: organizacje fact-checkingowe deklarujące standardy IFCN/EFCSN. Poziom 3: media – tylko jako kontekst."
  - "Każdy dokument ma zapisany adres, wydawcę, datę publikacji (jeśli podana) i datę pobrania."
  - "Szanujemy robots.txt i blokady serwisów. Źródło, które blokuje automatyczne pobieranie, nie trafia do katalogu do czasu uzgodnienia dostępu – nie obchodzimy zabezpieczeń ani paywalli."
  - "Treści na otwartych licencjach i materiały urzędowe przechowujemy w pełnym tekście. Dla treści chronionych prawem autorskim przechowujemy tylko tytuł, krótki fragment i link albo dane strukturalne (twierdzenie, ocena, link)."
  - "Źródło wykluczamy, gdy: straci status będący podstawą kwalifikacji, zmieni warunki korzystania na niezgodne z naszym użyciem, albo powtarzalnie publikuje sprostowane informacje bez korekt."
  - "Status źródła (np. sankcje UE) ani obecność domeny w katalogu incydentów nie przesądza o prawdziwości konkretnej treści – może najwyżej wywołać neutralne ostrzeżenie."
  - "Aktualizacja: `uv run python -m app.ingest.run` dopisuje nowe dokumenty; każdy przebieg zapisuje raport w data/corpus/manifest.json."

