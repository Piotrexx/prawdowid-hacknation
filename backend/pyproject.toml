[project]
name = "prawdowid-backend"
version = "0.2.0"
description = "Prawdowid - weryfikacja informacji oparta na źródłach, PostgreSQL i pgvector"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "sqlalchemy>=2.0,<2.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "lxml>=5.0",
    "anthropic>=1.0",
    "pillow>=11.0",
    "faster-whisper>=1.0",
    "stix2>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]
ingest = ["feedparser>=6.0", "ijson>=3.3"]

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
