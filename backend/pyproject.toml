[project]
name = "prawdowid-backend"
version = "0.2.0"
description = "Prawdowid - Wykrywanie fake news: URL -> trafilatura -> Bielik (keywords) -> Google Fact Check -> DeepSeek (verdict)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "trafilatura>=2.3.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "picimagesearch>=3.12.11",
    "imagehash>=4.3.2",
    "pillow>=13.0.0",
    "opencv-python-headless>=5.1.0.95",
    "c2pa-python>=0.39.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.uv]
default-groups = ["dev"]
# PicImageSearch pins lxml<6, but trafilatura>=2.3 needs lxml>=6; PicImageSearch works fine on lxml 6.
override-dependencies = ["lxml[html-clean]>=6.1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
