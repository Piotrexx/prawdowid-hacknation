[project]
name = "prawdowid-backend"
version = "0.1.0"
description = "Prawdowid - API weryfikacji informacji opartej na wiarygodnych zrodlach"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "sqlalchemy>=2.0",
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pillow>=11.0",
    "numpy>=2.0",
    "fastembed>=0.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]
ingest = ["feedparser>=6.0", "ijson>=3.3"]

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
